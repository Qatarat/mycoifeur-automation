appId: com.example.my_coiffeur
---
# Flow: Splash → country/language selection → onboarding → login screen

- launchApp:
    clearState: true

- waitForAnimationToEnd:
    timeout: 20000

# Dismiss location permission if shown on first CI install
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn:
          text: "While using the app"

# Country / language selection (cold start on CI emulator)
- tapOn:
    text: "Select your country"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: ".*Saudi Arabia.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Select your language"
    optional: true
- tapOn:
    text: "English"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Onboarding skip
- tapOn:
    text: "Skip"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: splash_onboarding_complete

# Verify we reach the login / home screen — the app should show either the
# login entry point or the guest-accessible home feed.  Both are acceptable.
- assertVisible:
    text: "Login to your account|User Login|Browse|Home|Skip|Get Started"
    optional: true

- takeScreenshot: splash_onboarding_login_screen
