appId: com.example.my_coiffeur
---
# Flow: Login → search provider → select service → add to cart → verify cart state

- launchApp:
    clearState: true

- waitForAnimationToEnd:
    timeout: 20000

# Dismiss location permission if shown on first CI install
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn:
          text: "While using the app"

# Country / language selection (cold start on CI emulator)
- tapOn:
    text: "Select your country"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: ".*Saudi Arabia.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Select your language"
    optional: true
- tapOn:
    text: "English"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Skip onboarding
- tapOn:
    text: "Skip"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# Navigate to login
- tapOn:
    text: "Login to your account"
    optional: true
- tapOn:
    text: "User Login.*"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# Select Bangladesh country code (+880)
- tapOn:
    text: ".*\\+966.*"
    optional: true
- tapOn:
    point: "50%, 13%"
- inputText: "Bangladesh"
- tapOn:
    text: ".*\\+880.*"
    optional: true

# Enter phone and login
- inputText: "1316314566"
- tapOn:
    text: "Continue"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000
- inputText: "1234"
- tapOn:
    text: "Verify Code.*"
    optional: true
- tapOn:
    text: "Verify"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000

# Search for provider
- tapOn:
    text: "Search for a service or provider"
    optional: true
- tapOn:
    text: "Search providers and services..."
    optional: true
- inputText: "Sarah"
- waitForAnimationToEnd:
    timeout: 3000

# Select provider
- tapOn:
    text: "Sarah Beauty Studio"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Select a service and add to cart
- tapOn:
    text: "Choose Service"
    optional: true
- tapOn:
    text: "Add"
    optional: true
- tapOn:
    text: "Book Now"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: cart_with_items
