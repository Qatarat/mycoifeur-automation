appId: com.example.my_coiffeur
---
# Flow: Launch → country/language → login with Bangladesh phone → OTP → home

- launchApp:
    clearState: true

- waitForAnimationToEnd:
    timeout: 20000

# Dismiss location permission if shown on first CI install
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn:
          text: "While using the app"

# Country / language selection (cold start on CI emulator)
- tapOn:
    text: "Select your country"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: ".*Saudi Arabia.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Select your language"
    optional: true
- tapOn:
    text: "English"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Skip onboarding
- tapOn:
    text: "Skip"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# Navigate to login
- tapOn:
    text: "Login to your account"
    optional: true
- tapOn:
    text: "User Login.*"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# Select Bangladesh country code (+880)
- tapOn:
    text: ".*\\+966.*"
    optional: true
- tapOn:
    point: "50%, 13%"
- inputText: "Bangladesh"
- tapOn:
    text: ".*\\+880.*"
    optional: true

# Enter phone number
- inputText: "1316314566"

# Agree to terms if shown
- tapOn:
    text: "By continuing you agree"
    optional: true

# Send verification code
- tapOn:
    text: "Continue"
    optional: true
- pressKey: Enter

- waitForAnimationToEnd:
    timeout: 5000

# Enter OTP
- inputText: "1234"

# Verify
- tapOn:
    text: "Verify Code.*"
    optional: true
- tapOn:
    text: "Verify"
    optional: true

- waitForAnimationToEnd:
    timeout: 8000

- takeScreenshot: login_otp_success
