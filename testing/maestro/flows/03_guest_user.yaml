appId: com.example.my_coiffeur
---
# Flow: Launch as guest → verify guest browsing → login gate on protected feature

- launchApp:
    clearState: true

- waitForAnimationToEnd:
    timeout: 20000

# Dismiss location permission if shown on first CI install
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn:
          text: "While using the app"

# Country / language selection (cold start on CI emulator)
- tapOn:
    text: "Select your country"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: ".*Saudi Arabia.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Select your language"
    optional: true
- tapOn:
    text: "English"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Skip onboarding if shown
- tapOn:
    text: "Skip"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# Try to continue as guest (various labels the app may use)
- tapOn:
    text: "Guest"
    optional: true
- tapOn:
    text: "Continue as Guest"
    optional: true
- tapOn:
    text: "Browse as Guest"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: guest_user_home

# Trigger a protected feature to confirm login gate
- tapOn:
    text: "Book Now"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: guest_user_login_prompt

# Verify a login prompt or login button is now visible
- assertVisible:
    text: "Login to your account|User Login|Login|Sign in"
    optional: true
